# WAHA + group bot on one private network. No public ports except what you
# choose to expose for the dashboard (default: none -- reach it via SSH tunnel).
#
#   bot  --calls-->  http://waha:3000   (WAHA API)
#   waha --POSTs-->  http://bot:8080    (message webhooks)
#
# Secrets/config live in .env (gitignored). Copy env.example -> .env and fill in.
services:
  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-GOWS}
      WAHA_PRINT_QR: "False"
    volumes:
      - waha-sessions:/app/.sessions
      - waha-media:/app/.media
    # Dashboard is NOT published by default. To peek at it, SSH-tunnel 3000:
    #   ssh -L 3000:localhost:3000 root@<server>
    # then open http://localhost:3000  (uncomment the ports line to bind locally)
    # ports:
    #   - "127.0.0.1:3000:3000"
    networks: [botnet]

  bot:
    build: .
    restart: unless-stopped
    depends_on: [waha]
    environment:
      # point the bot at WAHA over the compose network
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      GROUP_CHAT_ID: ${GROUP_CHAT_ID}
      TRIGGER_PREFIX: ${TRIGGER_PREFIX:-@bang-rahmat}
      REPLY_PREFIX: ${REPLY_PREFIX:-🤖 }
      # webhook mode: WAHA posts to the bot by its service name
      BOT_MODE: webhook
      PUBLIC_WEBHOOK_URL: http://bot:8080
      WEBHOOK_PORT: "8080"
      WEBHOOK_EVENTS: ${WEBHOOK_EVENTS:-message.any}
      # LLM
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-5.4-mini}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-}
      # tools
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    networks: [botnet]

networks:
  botnet:

volumes:
  waha-sessions:
  waha-media:
